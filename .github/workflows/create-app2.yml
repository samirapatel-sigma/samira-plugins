name: Create and Deploy App
description: create and deploy plugin code
on:
  workflow_dispatch:
    inputs:
      folderName:
        description: "Folder name to create"
        required: true
      files:
        description: "Base64 or JSON encoded files object"
        required: true

jobs:
  create-and-deploy:
    name: Create and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create folder and decode files
        run: |
          mkdir -p "${{ github.event.inputs.folderName }}"
          echo "create directory ${{ github.event.inputs.folderName }}"
          echo "${{ github.event.inputs.files }}" > temp.json
          node -e '
          const fs = require("fs");
          const folder = process.env.FOLDER;
          const fileContents = fs.readFileSync("temp.json", "utf8");
          const decoded = Buffer.from(fileContents, "base64").toString("utf8");
          const files = JSON.parse(decoded);
          console.log(files);
          for (const [filePath, contentBase64] of Object.entries(files)) {
            const fullPath = path.join(folder, filePath);
            console.log(fullPath);
            fs.mkdirSync(path.dirname(fullPath), { recursive: true });
            const content = Buffer.from(contentBase64, "base64").toString("utf8");
            console.log("content:",content);
            fs.writeFileSync(fullPath, content, "utf8");
            console.log("✅ Created:", fullPath);
          }
          '
        env:
          FOLDER: ${{ github.event.inputs.folderName }}

      - name: Commit and push the code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add ${{ github.event.inputs.folderName }}"
          git push

      - name: Install dependencies
        working-directory: ${{ github.event.inputs.folderName }}
        run: npm install

      - name: Build project
        working-directory: ${{ github.event.inputs.folderName }}
        run: npm run build

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.inputs.folderName }}"
          git commit -m "Add ${{ github.event.inputs.folderName }}" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref }}

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.event.inputs.folderName }}/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: output
        run: echo "hello world"
