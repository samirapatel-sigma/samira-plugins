name: Update Sigma workbooks on PR merge

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  update-workbooks:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get Sigma access token
        id: auth
        run: |
          RESPONSE=$(curl -s -X POST "https://api.sigmacomputing.com/v2/auth/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials&client_id=${{ secrets.SIGMA_CLIENT_ID }}&client_secret=${{ secrets.SIGMA_CLIENT_SECRET }}")
          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token // empty')
          if [ -z "$TOKEN" ]; then
            echo "Auth failed. Response: $RESPONSE"
            exit 1
          fi
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Update changed workbooks in Sigma
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep '\.json$' || true)

          if [ -z "$CHANGED" ]; then
            echo "No JSON files changed, skipping."
            exit 0
          fi

          MAPPING=$(cat .sigma/workbooks.json)

          for FILE in $CHANGED; do
            WORKBOOK_ID=$(echo "$MAPPING" | jq -r --arg f "$FILE" '.[$f] // empty')

            if [ -z "$WORKBOOK_ID" ]; then
              echo "No workbook mapped for $FILE, skipping."
              continue
            fi

            echo "Updating workbook $WORKBOOK_ID from $FILE..."
            curl --fail-with-body -X PUT \
              "https://api.sigmacomputing.com/v2/workbooks/$WORKBOOK_ID/spec" \
              -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
              -H "Content-Type: application/json" \
              --data-binary @"$FILE"

            echo "Done: $FILE → $WORKBOOK_ID"
          done
