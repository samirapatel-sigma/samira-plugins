name: Update Sigma workbooks on PR merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  update-workbooks:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get Sigma access token
        id: auth
        run: |
          BASE_URL="${{ secrets.SIGMA_BASE_URL || 'https://api.sigmacomputing.com' }}"
          RESPONSE=$(curl -s -X POST "$BASE_URL/v2/auth/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "bypass-tunnel-reminder: true" \
            -d "grant_type=client_credentials&client_id=${{ secrets.SIGMA_CLIENT_ID }}&client_secret=${{ secrets.SIGMA_CLIENT_SECRET }}")
          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token // empty')
          if [ -z "$TOKEN" ]; then
            echo "Auth failed. Response: $RESPONSE"
            exit 1
          fi
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "base_url=$BASE_URL" >> $GITHUB_OUTPUT

      - name: Sync changed workbooks with Sigma
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep '\.json$' || true)

          if [ -z "$CHANGED" ]; then
            echo "No JSON files changed, skipping."
            exit 0
          fi

          NEEDS_COMMIT=false

          for FILE in $CHANGED; do
            [ -f "$FILE" ] || continue

            DOC_VERSION=$(jq -r '.documentVersion // empty' "$FILE" 2>/dev/null || true)
            if [ -z "$DOC_VERSION" ]; then
              echo "Skipping $FILE — not a Sigma workbook spec (missing documentVersion)."
              continue
            fi

            WORKBOOK_ID=$(jq -r '.workbookId // .id // empty' "$FILE" 2>/dev/null || true)

            if [ -z "$WORKBOOK_ID" ]; then
              # No workbook ID — create a new workbook in Sigma
              echo "Creating new workbook from $FILE..."
              HTTP_CODE=$(curl -s -o /tmp/sigma_resp.json -w "%{http_code}" -X POST \
                "${{ steps.auth.outputs.base_url }}/v2/workbooks/spec" \
                -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
                -H "Content-Type: application/json" \
                -H "Accept: application/json" \
                -H "bypass-tunnel-reminder: true" \
                --data-binary @"$FILE")

              if [ "$HTTP_CODE" != "200" ]; then
                echo "Failed to create workbook from $FILE (HTTP $HTTP_CODE):"
                cat /tmp/sigma_resp.json
                continue
              fi

              WORKBOOK_ID=$(jq -r '.workbookId // .id // empty' /tmp/sigma_resp.json)
              if [ -z "$WORKBOOK_ID" ]; then
                echo "No workbook ID in Sigma response for $FILE, skipping."
                continue
              fi

              # Embed workbook ID in the spec and rename the file to <workbookId>.json
              DIR=$(dirname "$FILE")
              NEW_FILE="$DIR/$WORKBOOK_ID.json"
              jq --arg id "$WORKBOOK_ID" '. + {workbookId: $id}' "$FILE" > /tmp/updated_spec.json
              git rm "$FILE"
              cp /tmp/updated_spec.json "$NEW_FILE"
              git add "$NEW_FILE"
              NEEDS_COMMIT=true
              echo "Created workbook $WORKBOOK_ID, renamed $FILE → $NEW_FILE"
            else
              # Existing workbook — update it
              echo "Updating workbook $WORKBOOK_ID from $FILE..."
              curl --fail-with-body -X PUT \
                "${{ steps.auth.outputs.base_url }}/v2/workbooks/$WORKBOOK_ID/spec" \
                -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
                -H "Content-Type: application/json" \
                -H "Accept: application/json" \
                -H "bypass-tunnel-reminder: true" \
                --data-binary @"$FILE"
              echo "Done: $FILE → $WORKBOOK_ID"
            fi
          done

          if [ "$NEEDS_COMMIT" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: assign workbook IDs after Sigma create"
            git push origin main
          fi
